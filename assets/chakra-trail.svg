<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Naruto chakra contribution trail</title>
  <desc id="desc">A cinematic animated Naruto action scene with a giant blue Rasengan, fiery fox chakra aura and glowing contribution trail.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset=".58" stop-color="#071426"/><stop offset="1" stop-color="#180908"/></linearGradient>
    <radialGradient id="rasengan"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".2" stop-color="#E0F2FE"/><stop offset=".48" stop-color="#38BDF8"/><stop offset=".72" stop-color="#2563EB"/><stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/></radialGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F59E0B"/><stop offset=".42" stop-color="#F97316"/><stop offset=".72" stop-color="#FB923C"/><stop offset="1" stop-color="#FDE047"/></linearGradient>
    <linearGradient id="orangeSuit" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FB923C"/><stop offset="1" stop-color="#EA580C"/></linearGradient>
    <filter id="blueGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="orangeGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="23" height="23" patternUnits="userSpaceOnUse"><rect x="3" y="3" width="15" height="15" rx="3" fill="#1E293B" opacity=".75"/></pattern>
  </defs>

  <rect width="1200" height="460" rx="28" fill="url(#night)"/>
  <circle cx="1088" cy="68" r="31" fill="#E2E8F0" opacity=".72"/><circle cx="1078" cy="59" r="8" fill="#94A3B8" opacity=".22"/>

  <!-- huge fox chakra aura -->
  <g fill="none" stroke-linecap="round" filter="url(#orangeGlow)">
    <path d="M770 57C860 -8 1011 19 1085 111C1146 187 1119 274 1031 299C979 313 925 290 896 252C945 271 992 252 1012 213C1037 163 995 115 939 125C887 134 850 178 831 229C820 166 800 102 770 57Z" stroke="url(#fire)" stroke-width="15" opacity=".9"><animate attributeName="stroke-width" values="11;19;11" dur="1.35s" repeatCount="indefinite"/></path>
    <path d="M855 111L807 41L893 88M1008 109L1092 52L1048 145" stroke="#FB923C" stroke-width="11"/>
    <path d="M900 183Q930 158 965 181M1014 184Q1046 158 1073 181" stroke="#FEF3C7" stroke-width="8"/>
    <path d="M944 224Q1004 267 1062 221" stroke="#FDBA74" stroke-width="9"/>
    <path d="M833 247C779 213 750 157 713 111M861 276C794 251 748 224 692 181" stroke="#F97316" stroke-width="9" stroke-dasharray="25 15"><animate attributeName="stroke-dashoffset" values="0;-80" dur="1.1s" repeatCount="indefinite"/></path>
    <path d="M731 71C836 6 961 8 1066 84" stroke="#FDE047" stroke-opacity=".28" stroke-width="4"><animate attributeName="opacity" values=".12;.55;.12" dur="1.2s" repeatCount="indefinite"/></path>
  </g>

  <!-- Naruto in forward attack pose -->
  <g id="naruto" transform="translate(474 42) rotate(-7 190 160)">
    <animateTransform attributeName="transform" additive="sum" type="translate" values="0 0;7 -5;0 0" dur=".82s" repeatCount="indefinite"/>

    <!-- trailing headband cloth -->
    <path d="M214 53C268 22 318 25 350 45C309 44 292 56 274 74C310 67 341 76 365 96C312 84 279 89 246 106" fill="none" stroke="#0F172A" stroke-width="12" stroke-linecap="round"/>

    <!-- back leg -->
    <path d="M186 214L276 273L330 300" fill="none" stroke="#111827" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M271 273L329 300" stroke="url(#orangeSuit)" stroke-width="28" stroke-linecap="round"/>
    <path d="M325 300L366 312" stroke="#0F172A" stroke-width="19" stroke-linecap="round"/>

    <!-- front leg -->
    <path d="M165 210L124 292L80 324" fill="none" stroke="#111827" stroke-width="35" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M150 238L124 292" stroke="url(#orangeSuit)" stroke-width="28" stroke-linecap="round"/>
    <path d="M84 323L46 333" stroke="#0F172A" stroke-width="19" stroke-linecap="round"/>

    <!-- torso -->
    <path d="M145 102C186 76 245 82 279 119L268 213C229 245 172 240 135 207Z" fill="#111827" stroke="#020617" stroke-width="5"/>
    <path d="M157 128H265V195H157Z" fill="url(#orangeSuit)"/>
    <path d="M209 124V204" stroke="#111827" stroke-width="8"/>
    <path d="M148 113Q207 95 276 119" fill="none" stroke="#F8FAFC" stroke-opacity=".1" stroke-width="5"/>

    <!-- anime face -->
    <path d="M162 78C160 39 191 17 226 21C260 24 283 50 277 84C271 118 244 138 210 134C178 131 162 109 162 78Z" fill="#F3C7A5" stroke="#0F172A" stroke-width="5"/>
    <!-- hair -->
    <path d="M162 61L144 37L174 42L169 13L190 35L200 4L213 34L233 5L235 37L266 17L254 47L286 41L266 65L285 75L253 78L241 49L193 45Z" fill="#FACC15" stroke="#EAB308" stroke-width="4"/>
    <!-- forehead protector -->
    <path d="M157 65Q214 43 276 64L272 82Q216 68 161 83Z" fill="#111827"/>
    <rect x="190" y="55" width="58" height="25" rx="5" fill="#CBD5E1" stroke="#64748B" stroke-width="3"/>
    <path d="M219 60C208 63 207 74 217 76C224 77 231 71 227 66C224 62 218 63 215 65" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <!-- eyes / whiskers / mouth -->
    <path d="M184 92Q198 82 211 91M229 90Q242 80 256 89" stroke="#0EA5E9" stroke-width="5" stroke-linecap="round"/>
    <circle cx="199" cy="91" r="3.2" fill="#0F172A"/><circle cx="243" cy="89" r="3.2" fill="#0F172A"/>
    <path d="M175 104l-21 4M178 114l-21 9M261 102l21 4M258 112l21 9" stroke="#92400E" stroke-width="3" stroke-linecap="round"/>
    <path d="M194 118Q216 139 243 116" fill="#7C2D12" stroke="#7C2D12" stroke-width="3" stroke-linejoin="round"/>
    <path d="M200 121Q217 129 237 120" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round"/>

    <!-- extended Rasengan arm, foreshortened -->
    <path d="M148 139L88 119L31 101" fill="none" stroke="#111827" stroke-width="40" stroke-linecap="round"/>
    <path d="M83 118L28 101" fill="none" stroke="#F3C7A5" stroke-width="27" stroke-linecap="round"/>
    <ellipse cx="15" cy="97" rx="28" ry="21" fill="#F3C7A5" transform="rotate(-18 15 97)"/>
    <path d="M-4 89L-27 75M3 83L-18 62M12 80L-4 54M21 82L12 54" stroke="#F3C7A5" stroke-width="9" stroke-linecap="round"/>

    <!-- back arm -->
    <path d="M270 135L329 104L383 76" fill="none" stroke="#111827" stroke-width="36" stroke-linecap="round"/>
    <path d="M329 104L386 74" fill="none" stroke="#F3C7A5" stroke-width="23" stroke-linecap="round"/>
  </g>

  <!-- giant Rasengan in foreground -->
  <g transform="translate(337 145)" filter="url(#blueGlow)">
    <circle r="95" fill="url(#rasengan)" opacity=".98"><animate attributeName="r" values="78;110;78" dur="1.02s" repeatCount="indefinite"/></circle>
    <circle r="61" fill="none" stroke="#E0F2FE" stroke-width="6" stroke-dasharray="16 10"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur=".82s" repeatCount="indefinite"/></circle>
    <circle r="82" fill="none" stroke="#38BDF8" stroke-width="5" stroke-dasharray="33 14"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="1.2s" repeatCount="indefinite"/></circle>
    <path d="M-190 -18C-128 -78 -81 -58 -24 -15M-176 28C-118 82 -74 57 -20 14" fill="none" stroke="#38BDF8" stroke-width="11" stroke-linecap="round" stroke-dasharray="31 17"><animate attributeName="stroke-dashoffset" values="0;-118" dur=".72s" repeatCount="indefinite"/></path>
    <path d="M-150 -63C-99 -111 -51 -96 -18 -65" fill="none" stroke="#7DD3FC" stroke-width="5" opacity=".7"/>
  </g>
  <circle cx="337" cy="145" r="126" fill="none" stroke="#7DD3FC" stroke-opacity=".28" stroke-width="5"><animate attributeName="r" values="92;165" dur="1.12s" repeatCount="indefinite"/><animate attributeName="opacity" values=".85;0" dur="1.12s" repeatCount="indefinite"/></circle>

  <!-- orange chakra wave crossing the scene -->
  <g fill="none" stroke-linecap="round" filter="url(#orangeGlow)">
    <path d="M521 31C686 -42 872 -1 995 105" stroke="url(#fire)" stroke-width="10" stroke-dasharray="40 24"><animate attributeName="stroke-dashoffset" values="0;-130" dur="1.3s" repeatCount="indefinite"/></path>
    <path d="M548 62C692 6 841 37 933 111" stroke="#FDBA74" stroke-opacity=".42" stroke-width="4"><animate attributeName="opacity" values=".14;.72;.14" dur=".96s" repeatCount="indefinite"/></path>
  </g>

  <!-- contribution trail -->
  <g transform="translate(48 316)">
    <text x="0" y="-17" fill="#CBD5E1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" letter-spacing="4">CONTRIBUTION TRAIL</text>
    <text x="855" y="-17" fill="#FDBA74" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="3">CHAKRA MODE ACTIVE</text>
    <rect x="0" y="0" width="1104" height="112" rx="14" fill="#020617" fill-opacity=".7" stroke="#FFFFFF" stroke-opacity=".08"/>
    <rect x="18" y="15" width="1068" height="82" fill="url(#grid)"/>
    <path d="M28 71C96 15 145 95 211 43S337 98 397 50S518 12 579 64S695 95 757 44S879 12 945 66S1039 88 1070 37" fill="none" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" stroke-dasharray="14 11" filter="url(#orangeGlow)"><animate attributeName="stroke-dashoffset" values="0;-102" dur="1.02s" repeatCount="indefinite"/></path>
    <circle cx="1070" cy="37" r="9" fill="#FEF3C7" filter="url(#orangeGlow)"><animate attributeName="r" values="5;15;5" dur=".82s" repeatCount="indefinite"/></circle>
  </g>

  <!-- sparks -->
  <g filter="url(#blueGlow)">
    <circle cx="258" cy="69" r="3" fill="#F8FAFC"><animate attributeName="cy" values="69;28;69" dur="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="311" cy="252" r="2.5" fill="#7DD3FC"><animate attributeName="cx" values="311;269;311" dur="1.05s" repeatCount="indefinite"/></circle>
    <circle cx="708" cy="83" r="3" fill="#FDE047"><animate attributeName="opacity" values="0;1;0" dur=".63s" repeatCount="indefinite"/></circle>
    <circle cx="1134" cy="238" r="2.5" fill="#FB923C"><animate attributeName="r" values="1;6;1" dur=".9s" repeatCount="indefinite"/></circle>
  </g>
</svg>
