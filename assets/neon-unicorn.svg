<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">BLC cinematic unicorn runner</title>
  <desc id="desc">A clearly recognizable animated neon unicorn galloping through a cyber-night scene with a luminous mane, horn, rainbow trail and star particles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#030712"/><stop offset="0.52" stop-color="#071426"/><stop offset="1" stop-color="#120A28"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FAFC"/><stop offset="0.5" stop-color="#CFFAFE"/><stop offset="1" stop-color="#DDD6FE"/></linearGradient>
    <linearGradient id="mane" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="0.38" stop-color="#60A5FA"/><stop offset="0.68" stop-color="#C084FC"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F472B6"/><stop offset="0.25" stop-color="#C084FC"/><stop offset="0.5" stop-color="#60A5FA"/><stop offset="0.75" stop-color="#22D3EE"/><stop offset="1" stop-color="#FBBF24"/></linearGradient>
    <radialGradient id="hoof" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.35" stop-color="#67E8F9"/><stop offset="1" stop-color="#A855F7" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <pattern id="stars" width="64" height="64" patternUnits="userSpaceOnUse"><circle cx="9" cy="11" r="1" fill="#C4B5FD" opacity=".28"/><circle cx="43" cy="31" r="1.2" fill="#67E8F9" opacity=".2"/></pattern>
  </defs>

  <rect width="1200" height="400" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="28" fill="url(#stars)"/>
  <ellipse cx="360" cy="328" rx="310" ry="56" fill="#4C1D95" opacity=".18" filter="url(#soft)"/>
  <path d="M0 331H1200" stroke="#60A5FA" stroke-opacity=".26"/>
  <path d="M0 336H1200" stroke="#F472B6" stroke-opacity=".16"/>

  <g opacity=".72" filter="url(#glow)">
    <path d="M-70 225C45 150 150 250 282 181C364 138 420 146 510 176" fill="none" stroke="url(#rainbow)" stroke-width="8" stroke-linecap="round" stroke-dasharray="32 18"><animate attributeName="stroke-dashoffset" values="0;-100" dur="1.7s" repeatCount="indefinite"/></path>
    <path d="M-40 250C90 185 160 274 308 205C383 170 449 177 524 196" fill="none" stroke="#22D3EE" stroke-opacity=".48" stroke-width="3" stroke-dasharray="18 22"><animate attributeName="stroke-dashoffset" values="0;-80" dur="1.2s" repeatCount="indefinite"/></path>
  </g>

  <g id="runner" transform="translate(170 52)">
    <animateTransform attributeName="transform" additive="sum" type="translate" values="0 0;8 -5;18 0;8 5;0 0" dur=".68s" repeatCount="indefinite"/>

    <g filter="url(#glow)">
      <path d="M104 188C34 180 2 129 33 87C61 49 101 76 126 107C93 90 69 104 70 124C71 145 93 157 128 160" fill="none" stroke="url(#rainbow)" stroke-width="19" stroke-linecap="round"><animate attributeName="d" values="M104 188C34 180 2 129 33 87C61 49 101 76 126 107C93 90 69 104 70 124C71 145 93 157 128 160;M104 188C28 198 -7 151 20 103C45 58 92 72 130 110C88 96 54 116 66 143C74 162 101 169 132 166;M104 188C34 180 2 129 33 87C61 49 101 76 126 107C93 90 69 104 70 124C71 145 93 157 128 160" dur="1.5s" repeatCount="indefinite"/></path>
      <path d="M95 183C27 158 3 105 50 82" fill="none" stroke="#F0ABFC" stroke-width="5" stroke-linecap="round" opacity=".85"><animate attributeName="stroke-dasharray" values="4 12;18 8;4 12" dur="1.1s" repeatCount="indefinite"/></path>
    </g>

    <path d="M108 137C150 93 242 88 311 119C346 135 359 173 335 200C307 232 230 238 164 220C112 206 84 169 108 137Z" fill="url(#body)" stroke="#A5F3FC" stroke-width="4"/>
    <path d="M136 147C184 120 270 121 326 154" fill="none" stroke="#FFFFFF" stroke-opacity=".48" stroke-width="8" stroke-linecap="round"/>
    <path d="M303 133C327 88 354 59 393 50C426 42 460 54 475 81C489 107 478 134 448 145L404 161L366 196L326 185Z" fill="url(#body)" stroke="#C4B5FD" stroke-width="4"/>
    <path d="M372 76C340 56 326 69 337 92C310 78 300 102 320 119C294 114 288 137 312 149" fill="none" stroke="url(#mane)" stroke-width="16" stroke-linecap="round" filter="url(#glow)"><animate attributeName="stroke-width" values="13;19;13" dur="1.25s" repeatCount="indefinite"/></path>
    <path d="M395 55L386 25L416 48" fill="url(#body)" stroke="#C4B5FD" stroke-width="3"/>
    <path d="M426 57L443 26L448 70" fill="url(#body)" stroke="#A5F3FC" stroke-width="3"/>
    <ellipse cx="434" cy="95" rx="9" ry="11" fill="#0F172A" stroke="#67E8F9" stroke-width="3"/>
    <circle cx="437" cy="91" r="3" fill="#FFFFFF"><animate attributeName="cy" values="91;94;91" dur="2.8s" repeatCount="indefinite"/></circle>
    <path d="M459 118Q468 123 475 118" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>

    <g filter="url(#glow)">
      <path d="M444 65L505 8L463 79Z" fill="url(#mane)"/>
      <path d="M457 61L488 29" stroke="#FFFFFF" stroke-opacity=".8" stroke-width="3"/>
      <circle cx="505" cy="8" r="5" fill="#FFFFFF"><animate attributeName="r" values="3;8;3" dur="1.15s" repeatCount="indefinite"/></circle>
    </g>

    <g transform="translate(158 210)"><animateTransform attributeName="transform" additive="sum" type="rotate" values="30 0 0;-27 0 0;30 0 0" dur=".68s" repeatCount="indefinite"/><path d="M0 0L-9 65L34 96" fill="none" stroke="url(#body)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M31 97h37" stroke="#F0ABFC" stroke-width="13" stroke-linecap="round"/></g>
    <g transform="translate(213 219)" opacity=".72"><animateTransform attributeName="transform" additive="sum" type="rotate" values="-25 0 0;25 0 0;-25 0 0" dur=".68s" repeatCount="indefinite"/><path d="M0 0L14 61L-19 94" fill="none" stroke="#C7D2FE" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M-20 95h36" stroke="#67E8F9" stroke-width="12" stroke-linecap="round"/></g>
    <g transform="translate(317 196)"><animateTransform attributeName="transform" additive="sum" type="rotate" values="-28 0 0;27 0 0;-28 0 0" dur=".68s" repeatCount="indefinite"/><path d="M0 0L9 69L-30 99" fill="none" stroke="url(#body)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M-31 100h39" stroke="#C084FC" stroke-width="13" stroke-linecap="round"/></g>
    <g transform="translate(346 185)" opacity=".7"><animateTransform attributeName="transform" additive="sum" type="rotate" values="27 0 0;-27 0 0;27 0 0" dur=".68s" repeatCount="indefinite"/><path d="M0 0L-4 63L35 92" fill="none" stroke="#CFFAFE" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M34 93h37" stroke="#22D3EE" stroke-width="12" stroke-linecap="round"/></g>

    <g opacity=".88">
      <ellipse cx="201" cy="321" rx="58" ry="15" fill="url(#hoof)"><animate attributeName="rx" values="40;72;40" dur=".68s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="332" cy="319" rx="63" ry="16" fill="url(#hoof)"><animate attributeName="rx" values="70;38;70" dur=".68s" repeatCount="indefinite"/></ellipse>
    </g>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" transform="translate(820 96)">
    <text x="0" y="0" fill="#67E8F9" font-size="15" letter-spacing="4">BLC RUNNER / LIVE</text>
    <text x="0" y="52" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="750">Build. Validate. Ship.</text>
    <text x="0" y="84" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">A little magic between useful commits.</text>
    <rect x="0" y="112" width="298" height="38" rx="19" fill="#0B1220" stroke="#A78BFA" stroke-opacity=".42"/>
    <circle cx="20" cy="131" r="5" fill="#34D399"><animate attributeName="opacity" values="1;.2;1" dur="1.1s" repeatCount="indefinite"/></circle>
    <text x="37" y="136" fill="#64748B" font-size="12">UNICORN ENGINE ONLINE</text>
  </g>

  <g filter="url(#glow)">
    <path d="M1080 54l4 10 10 4-10 4-4 10-4-10-10-4 10-4Z" fill="#67E8F9"><animateTransform attributeName="transform" type="rotate" from="0 1080 68" to="360 1080 68" dur="3.2s" repeatCount="indefinite"/></path>
    <path d="M1043 306l3 7 7 3-7 3-3 7-3-7-7-3 7-3Z" fill="#F472B6"><animate attributeName="opacity" values=".15;1;.15" dur="1.3s" repeatCount="indefinite"/></path>
    <circle cx="752" cy="66" r="3" fill="#C084FC"><animate attributeName="r" values="1;6;1" dur="1.7s" repeatCount="indefinite"/></circle>
  </g>
</svg>
