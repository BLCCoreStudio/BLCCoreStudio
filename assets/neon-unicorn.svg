<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">BLC cinematic unicorn runner</title>
  <desc id="desc">A detailed animated neon unicorn galloping through a cyber night with a luminous horn, flowing mane and rainbow energy trail.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset=".55" stop-color="#071426"/><stop offset="1" stop-color="#130829"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".34" stop-color="#E0F2FE"/><stop offset=".7" stop-color="#DDD6FE"/><stop offset="1" stop-color="#C4B5FD"/></linearGradient>
    <linearGradient id="mane" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".28" stop-color="#60A5FA"/><stop offset=".57" stop-color="#C084FC"/><stop offset=".83" stop-color="#F472B6"/><stop offset="1" stop-color="#F9A8D4"/></linearGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F472B6"/><stop offset=".23" stop-color="#A78BFA"/><stop offset=".47" stop-color="#60A5FA"/><stop offset=".72" stop-color="#22D3EE"/><stop offset="1" stop-color="#FBBF24"/></linearGradient>
    <radialGradient id="spark"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".35" stop-color="#67E8F9"/><stop offset="1" stop-color="#67E8F9" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>
    <pattern id="stars" width="72" height="72" patternUnits="userSpaceOnUse"><circle cx="10" cy="12" r="1" fill="#C4B5FD" opacity=".25"/><circle cx="49" cy="37" r="1.2" fill="#67E8F9" opacity=".22"/></pattern>
  </defs>

  <rect width="1200" height="400" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="28" fill="url(#stars)"/>
  <ellipse cx="430" cy="329" rx="365" ry="58" fill="#4C1D95" opacity=".16" filter="url(#soft)"/>
  <path d="M0 331H1200" stroke="#38BDF8" stroke-opacity=".30"/>
  <path d="M0 337H1200" stroke="#F472B6" stroke-opacity=".18"/>

  <!-- speed ribbons -->
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M-95 244C45 151 145 268 300 181C378 137 446 143 540 177" stroke="url(#rainbow)" stroke-width="10" stroke-dasharray="38 20"><animate attributeName="stroke-dashoffset" values="0;-116" dur="1.65s" repeatCount="indefinite"/></path>
    <path d="M-70 276C74 190 175 291 323 215C401 175 462 176 554 199" stroke="#22D3EE" stroke-opacity=".5" stroke-width="4" stroke-dasharray="20 22"><animate attributeName="stroke-dashoffset" values="0;-88" dur="1.15s" repeatCount="indefinite"/></path>
  </g>

  <g id="unicorn" transform="translate(154 48)">
    <animateTransform attributeName="transform" additive="sum" type="translate" values="0 0;9 -6;19 0;9 6;0 0" dur=".72s" repeatCount="indefinite"/>

    <!-- flowing tail -->
    <g fill="none" stroke="url(#mane)" stroke-linecap="round" filter="url(#glow)">
      <path d="M136 174C60 178 10 135 36 87C61 42 118 58 153 105" stroke-width="24"><animate attributeName="d" values="M136 174C60 178 10 135 36 87C61 42 118 58 153 105;M136 174C52 202 -4 163 24 106C49 56 108 57 156 109;M136 174C60 178 10 135 36 87C61 42 118 58 153 105" dur="1.45s" repeatCount="indefinite"/></path>
      <path d="M131 166C66 147 43 101 77 78" stroke="#F9A8D4" stroke-width="7"><animate attributeName="stroke-dasharray" values="6 15;22 10;6 15" dur="1.05s" repeatCount="indefinite"/></path>
      <path d="M128 182C68 201 30 175 18 149" stroke="#67E8F9" stroke-width="6" opacity=".75"/>
    </g>

    <!-- equine torso -->
    <path d="M125 137C170 93 267 83 343 112C384 128 405 164 384 197C357 238 268 249 189 227C126 210 91 169 125 137Z" fill="url(#body)" stroke="#A5F3FC" stroke-width="4.5"/>
    <path d="M151 144C205 112 298 111 364 149" fill="none" stroke="#FFFFFF" stroke-opacity=".48" stroke-width="9" stroke-linecap="round"/>
    <path d="M160 194C212 216 304 220 362 189" fill="none" stroke="#A78BFA" stroke-opacity=".24" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="237" cy="149" rx="72" ry="42" fill="#FFFFFF" opacity=".08"/>

    <!-- neck and realistic horse head -->
    <path d="M343 126C366 83 392 51 435 40C472 30 512 42 532 72C550 100 538 131 503 148L457 161L414 199L373 184Z" fill="url(#body)" stroke="#C4B5FD" stroke-width="4.5"/>
    <path d="M430 63C463 44 500 50 519 75C534 96 528 118 503 132L462 142C474 126 472 107 458 96C446 86 431 84 416 91Z" fill="#F8FAFC" opacity=".18"/>
    <path d="M466 132Q491 143 514 128" fill="none" stroke="#64748B" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="488" cy="91" rx="10" ry="12" fill="#0F172A" stroke="#67E8F9" stroke-width="3"/>
    <circle cx="492" cy="87" r="3" fill="#FFFFFF"><animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;.44;.5;.56;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <path d="M447 57L437 25L470 48" fill="url(#body)" stroke="#C4B5FD" stroke-width="3"/>
    <path d="M485 55L505 22L509 68" fill="url(#body)" stroke="#A5F3FC" stroke-width="3"/>

    <!-- long spiral horn -->
    <g filter="url(#glow)">
      <path d="M501 61L586 -5L523 78Z" fill="url(#mane)"/>
      <path d="M521 56L575 9M531 44L568 23M541 33L560 37" stroke="#FFFFFF" stroke-opacity=".75" stroke-width="3"/>
      <circle cx="586" cy="-5" r="6" fill="#FFFFFF"><animate attributeName="r" values="3;10;3" dur="1.1s" repeatCount="indefinite"/></circle>
    </g>

    <!-- lavish mane -->
    <g fill="none" stroke="url(#mane)" stroke-linecap="round" filter="url(#glow)">
      <path d="M427 56C390 41 367 58 379 85C345 69 330 95 353 117C322 110 313 139 340 155" stroke-width="18"><animate attributeName="stroke-width" values="14;22;14" dur="1.25s" repeatCount="indefinite"/></path>
      <path d="M425 67C388 59 374 78 389 99C356 90 349 111 365 128" stroke="#67E8F9" stroke-width="7"/>
      <path d="M438 48C402 27 379 38 379 61" stroke="#F9A8D4" stroke-width="6"/>
    </g>

    <!-- four long horse legs -->
    <g transform="translate(175 211)"><animateTransform attributeName="transform" additive="sum" type="rotate" values="31 0 0;-25 0 0;31 0 0" dur=".72s" repeatCount="indefinite"/><path d="M0 0L-10 74L37 108" fill="none" stroke="url(#body)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M34 108h38" stroke="#F0ABFC" stroke-width="12" stroke-linecap="round"/></g>
    <g transform="translate(235 221)" opacity=".76"><animateTransform attributeName="transform" additive="sum" type="rotate" values="-25 0 0;26 0 0;-25 0 0" dur=".72s" repeatCount="indefinite"/><path d="M0 0L16 66L-22 101" fill="none" stroke="#DDEAFE" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/><path d="M-23 102h37" stroke="#67E8F9" stroke-width="11" stroke-linecap="round"/></g>
    <g transform="translate(354 193)"><animateTransform attributeName="transform" additive="sum" type="rotate" values="-29 0 0;28 0 0;-29 0 0" dur=".72s" repeatCount="indefinite"/><path d="M0 0L10 76L-34 110" fill="none" stroke="url(#body)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M-35 111h41" stroke="#C084FC" stroke-width="12" stroke-linecap="round"/></g>
    <g transform="translate(385 182)" opacity=".74"><animateTransform attributeName="transform" additive="sum" type="rotate" values="29 0 0;-27 0 0;29 0 0" dur=".72s" repeatCount="indefinite"/><path d="M0 0L-4 69L38 101" fill="none" stroke="#E0F2FE" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/><path d="M36 102h40" stroke="#22D3EE" stroke-width="11" stroke-linecap="round"/></g>

    <!-- hoof flashes -->
    <g filter="url(#glow)">
      <ellipse cx="219" cy="327" rx="44" ry="12" fill="url(#spark)"><animate attributeName="rx" values="28;62;28" dur=".72s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="376" cy="325" rx="48" ry="13" fill="url(#spark)"><animate attributeName="rx" values="62;30;62" dur=".72s" repeatCount="indefinite"/></ellipse>
    </g>
  </g>

  <g transform="translate(825 106)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
    <text x="0" y="0" fill="#67E8F9" font-size="15" letter-spacing="4">BLC RUNNER / LIVE</text>
    <text x="0" y="50" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="750">Build. Validate. Ship.</text>
    <text x="0" y="82" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">A little magic between useful commits.</text>
  </g>

  <g filter="url(#glow)">
    <path d="M1090 53l4 10 10 4-10 4-4 10-4-10-10-4 10-4Z" fill="#67E8F9"><animateTransform attributeName="transform" type="rotate" from="0 1090 67" to="360 1090 67" dur="3.1s" repeatCount="indefinite"/></path>
    <path d="M1048 302l3 7 7 3-7 3-3 7-3-7-7-3 7-3Z" fill="#F472B6"><animate attributeName="opacity" values=".15;1;.15" dur="1.25s" repeatCount="indefinite"/></path>
  </g>
</svg>
