  <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="18"/></filter>
  <pattern id="stars" width="72" height="72" patternUnits="userSpaceOnUse"><circle cx="11" cy="13" r="1.2" fill="#93c5fd" opacity=".35"/><circle cx="52" cy="38" r="1" fill="#f0abfc" opacity=".25"/></pattern>
</defs>

