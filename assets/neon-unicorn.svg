<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">BLC neon unicorn runner</title>
  <desc id="desc">An original animated neon cyber-unicorn running through a stream of code particles.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B12"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="0.48" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.5" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" opacity="0.028"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="258" rx="26" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <rect x="1" y="1" width="1198" height="258" rx="26" fill="url(#dots)"/>
  <path d="M0 210H1200" stroke="#FFFFFF" stroke-opacity="0.05"/>

  <g opacity="0.85">
    <circle cx="72" cy="70" r="3" fill="#67E8F9"><animate attributeName="cx" values="72;22" dur="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="118" cy="120" r="2" fill="#A78BFA"><animate attributeName="cx" values="118;38" dur="1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="92" cy="178" r="2.5" fill="#F472B6"><animate attributeName="cx" values="92;8" dur="1.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.7s" repeatCount="indefinite"/></circle>
    <text x="145" y="58" fill="#4A5B70" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">0101</text>
    <text x="105" y="202" fill="#4A5B70" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">SHIP</text>
  </g>

  <g transform="translate(175 20)">
    <animateTransform attributeName="transform" additive="sum" type="translate" values="0 0;0 -5;0 0;0 4;0 0" dur="0.55s" repeatCount="indefinite"/>

    <!-- tail -->
    <g filter="url(#glow)">
      <path d="M78 116C18 84 19 50 62 44C38 63 59 75 102 84" fill="none" stroke="url(#tail)" stroke-width="10" stroke-linecap="round">
        <animate attributeName="d" values="M78 116C18 84 19 50 62 44C38 63 59 75 102 84;M78 116C12 110 17 65 62 50C37 71 60 85 102 84;M78 116C18 84 19 50 62 44C38 63 59 75 102 84" dur="1.1s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- rear leg -->
    <g transform="translate(118 148)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="22 0 0;-24 0 0;22 0 0" dur="0.55s" repeatCount="indefinite"/>
        <path d="M0 0L-4 45L22 66" fill="none" stroke="#5CCDF4" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M21 66h22" stroke="#C084FC" stroke-width="10" stroke-linecap="round"/>
      </g>
    </g>

    <!-- far front leg -->
    <g transform="translate(230 146)" opacity="0.72">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-20 0 0;24 0 0;-20 0 0" dur="0.55s" repeatCount="indefinite"/>
        <path d="M0 0L9 43L-12 68" fill="none" stroke="#8B7CF6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M-12 68h22" stroke="#67E8F9" stroke-width="9" stroke-linecap="round"/>
      </g>
    </g>

    <!-- body -->
    <path d="M88 98C116 70 178 62 225 83C253 96 267 122 253 144C237 168 192 174 143 166C105 160 78 141 76 119C75 111 79 104 88 98Z" fill="#111B2A" stroke="url(#neon)" stroke-width="5"/>
    <path d="M102 116C136 97 199 95 240 116" fill="none" stroke="#67E8F9" stroke-opacity="0.28" stroke-width="3"/>
    <circle cx="134" cy="119" r="5" fill="#67E8F9"><animate attributeName="opacity" values="1;.25;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="159" cy="119" r="5" fill="#A78BFA"><animate attributeName="opacity" values=".25;1;.25" dur="1.2s" repeatCount="indefinite"/></circle>
    <path d="M181 118h42" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="4" stroke-linecap="round"/>

    <!-- near rear leg -->
    <g transform="translate(142 151)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-24 0 0;26 0 0;-24 0 0" dur="0.55s" repeatCount="indefinite"/>
        <path d="M0 0L11 42L-10 69" fill="none" stroke="#67E8F9" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M-10 69h24" stroke="#A78BFA" stroke-width="10" stroke-linecap="round"/>
      </g>
    </g>

    <!-- near front leg -->
    <g transform="translate(224 149)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="24 0 0;-24 0 0;24 0 0" dur="0.55s" repeatCount="indefinite"/>
        <path d="M0 0L-2 44L26 65" fill="none" stroke="#7DD3FC" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M26 65h24" stroke="#C084FC" stroke-width="10" stroke-linecap="round"/>
      </g>
    </g>

    <!-- neck and head -->
    <path d="M220 93C230 67 244 50 264 42C282 35 304 39 315 55C326 70 319 89 302 97L268 111L244 132L223 123Z" fill="#111B2A" stroke="url(#neon)" stroke-width="5"/>
    <path d="M289 46L304 15L315 51" fill="#111B2A" stroke="#A78BFA" stroke-width="4" stroke-linejoin="round"/>
    <path d="M263 48L252 23L281 42" fill="#111B2A" stroke="#67E8F9" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="290" cy="66" r="7" fill="#071018" stroke="#67E8F9" stroke-width="3"/>
    <circle cx="292" cy="64" r="2" fill="#FFFFFF"><animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;.45;.5;.55;1" dur="3.4s" repeatCount="indefinite"/></circle>

    <!-- horn -->
    <g filter="url(#glow)">
      <path d="M312 52L356 28L322 66Z" fill="url(#neon)"/>
      <circle cx="351" cy="31" r="3" fill="#FFFFFF"><animate attributeName="r" values="2;5;2" dur="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".3;1;.3" dur="1.2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- mane -->
    <path d="M247 57C227 51 218 61 221 75C208 68 198 78 203 90C190 86 184 98 191 110" fill="none" stroke="url(#tail)" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g transform="translate(610 70)">
    <text x="0" y="0" fill="#66758A" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" letter-spacing="2">BLC RUNNER / LIVE</text>
    <text x="0" y="52" fill="#F1F5F9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Build. Validate. Ship.</text>
    <text x="0" y="90" fill="#91A0B3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Small tools, local-first products, measurable behavior.</text>
    <g transform="translate(0 124)">
      <rect width="405" height="36" rx="18" fill="#0B141F" stroke="#67E8F9" stroke-opacity="0.24"/>
      <circle cx="20" cy="18" r="5" fill="#34D399"><animate attributeName="opacity" values="1;.25;1" dur="1.3s" repeatCount="indefinite"/></circle>
      <text x="36" y="23" fill="#75869B" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">moving forward one useful commit at a time</text>
    </g>
  </g>

  <g opacity="0.8">
    <path d="M1100 43l4 9 9 4-9 4-4 9-4-9-9-4 9-4Z" fill="#67E8F9"><animateTransform attributeName="transform" type="rotate" from="0 1100 56" to="360 1100 56" dur="4s" repeatCount="indefinite"/></path>
    <path d="M1060 195l3 6 6 3-6 3-3 6-3-6-6-3 6-3Z" fill="#A78BFA"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></path>
    <path d="M1145 156l2 5 5 2-5 2-2 5-2-5-5-2 5-2Z" fill="#F472B6"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></path>
  </g>
</svg>
