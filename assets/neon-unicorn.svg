<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">BLCCoreStudio animated rainbow unicorn runner</title>
<desc id="desc">A large, recognizable neon unicorn galloping across a cyber-night scene with a rainbow mane, tail, glowing horn and moving light trails.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset=".52" stop-color="#07152a"/><stop offset="1" stop-color="#170b2b"/></linearGradient>
  <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".46" stop-color="#eaf7ff"/><stop offset=".75" stop-color="#e8ddff"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient>
  <linearGradient id="mane" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff4f9a"/><stop offset=".18" stop-color="#f97316"/><stop offset=".34" stop-color="#facc15"/><stop offset=".50" stop-color="#34d399"/><stop offset=".66" stop-color="#22d3ee"/><stop offset=".82" stop-color="#60a5fa"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff3b81"/><stop offset=".45" stop-color="#22d3ee"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
  <radialGradient id="moon"><stop offset="0" stop-color="#bfdbfe"/><stop offset=".7" stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb" stop-opacity=".15"/></radialGradient>
