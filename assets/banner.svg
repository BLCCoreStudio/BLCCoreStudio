      <circle cx="31" cy="126" r="4" fill="#22D3EE"/>
      <text x="48" y="132" fill="#E6EEF7" font-size="17" font-weight="650">Local-first by default</text>

      <circle cx="31" cy="169" r="4" fill="#A78BFA"/>
      <text x="48" y="175" fill="#E6EEF7" font-size="17" font-weight="650">Reproducible releases</text>

      <circle cx="31" cy="212" r="4" fill="#A78BFA"/>
