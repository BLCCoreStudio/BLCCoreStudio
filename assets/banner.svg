      <rect x="240" width="116" height="36" rx="18" fill="#0B1725" stroke="#22D3EE" stroke-opacity="0.22"/>
      <text x="298" y="23" fill="#CFFAFE" text-anchor="middle">ANDROID</text>
      <rect x="368" width="108" height="36" rx="18" fill="#0B1725" stroke="#A78BFA" stroke-opacity="0.22"/>
      <text x="422" y="23" fill="#EDE9FE" text-anchor="middle">CI / CD</text>
      <rect x="488" width="140" height="36" rx="18" fill="#0B1725" stroke="#A78BFA" stroke-opacity="0.22"/>
      <text x="558" y="23" fill="#EDE9FE" text-anchor="middle">LOCAL-FIRST</text>
