    </radialGradient>
    <radialGradient id="glowB" cx="0.86" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1400" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="420" rx="28" fill="url(#glowA)"/>
  <rect width="1400" height="420" rx="28" fill="url(#glowB)"/>
  <rect width="1400" height="420" rx="28" fill="url(#grid)"/>

  <circle cx="1140" cy="78" r="88" fill="#22D3EE" fill-opacity="0.08" filter="url(#soft)"/>
  <circle cx="1260" cy="330" r="105" fill="#A78BFA" fill-opacity="0.08" filter="url(#soft)"/>

  <g transform="translate(84 68)">
