  <rect x="24" y="82" width="1148" height="2" fill="url(#header)" opacity=".62"/>

  <g transform="translate(24 96)"><rect width="570" height="205" rx="24" fill="#0A1020" stroke="url(#g0)" stroke-opacity=".66" stroke-width="2"/><circle cx="506" cy="37" r="48" fill="#22D3EE" opacity=".07"><animate attributeName="r" values="42;58;42" dur="3s" repeatCount="indefinite"/></circle><circle cx="526" cy="55" r="24" fill="#2563EB" opacity=".08"><animate attributeName="cy" values="55;42;55" dur="2.5s" repeatCount="indefinite"/></circle><rect x="22" y="22" width="9" height="45" rx="4.5" fill="url(#g0)"/><text x="49" y="49" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="750">OpenDevIndex</text><text x="24" y="94" fill="#A9B7CA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5">Open structured index of software, AI, security and developer tools.</text><line x1="24" y1="125" x2="546" y2="125" stroke="#FFFFFF" stroke-opacity=".07"/><circle cx="30" cy="158" r="5" fill="#22D3EE"/><text x="44" y="163" fill="#CBD5E1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">Python</text><text x="199" y="163" fill="#FDE68A" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">★ 1</text><text x="280" y="163" fill="#C4B5FD" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">⑂ 0</text><text x="389" y="163" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">2026-09-06</text><rect x="24" y="178" width="522" height="3" rx="1.5" fill="#172033"/><rect x="24" y="178" width="172" height="3" rx="1.5" fill="url(#g0)"><animate attributeName="x" values="24;374;24" dur="4.5s" repeatCount="indefinite"/></rect></g>

  <g transform="translate(606 96)"><rect width="570" height="205" rx="24" fill="#0A1020" stroke="url(#g1)" stroke-opacity=".66" stroke-width="2"/><circle cx="506" cy="37" r="48" fill="#A78BFA" opacity=".07"><animate attributeName="r" values="42;58;42" dur="3.2s" repeatCount="indefinite"/></circle><circle cx="526" cy="55" r="24" fill="#EC4899" opacity=".08"><animate attributeName="cy" values="55;42;55" dur="2.7s" repeatCount="indefinite"/></circle><rect x="22" y="22" width="9" height="45" rx="4.5" fill="url(#g1)"/><text x="49" y="49" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="750">RepoDoctor</text><text x="24" y="94" fill="#A9B7CA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5">Repository health analysis for security, testing, CI/CD and docs.</text><line x1="24" y1="125" x2="546" y2="125" stroke="#FFFFFF" stroke-opacity=".07"/><circle cx="30" cy="158" r="5" fill="#A78BFA"/><text x="44" y="163" fill="#CBD5E1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">Shell</text><text x="199" y="163" fill="#FDE68A" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">★ 1</text><text x="280" y="163" fill="#C4B5FD" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">⑂ 0</text><text x="389" y="163" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">2026-08-31</text><rect x="24" y="178" width="522" height="3" rx="1.5" fill="#172033"/><rect x="24" y="178" width="172" height="3" rx="1.5" fill="url(#g1)"><animate attributeName="x" values="24;374;24" dur="4.1s" repeatCount="indefinite"/></rect></g>

  <g transform="translate(24 319)"><rect width="570" height="205" rx="24" fill="#0A1020" stroke="url(#g2)" stroke-opacity=".66" stroke-width="2"/><circle cx="506" cy="37" r="48" fill="#F59E0B" opacity=".07"><animate attributeName="r" values="42;58;42" dur="2.8s" repeatCount="indefinite"/></circle><circle cx="526" cy="55" r="24" fill="#F97316" opacity=".08"><animate attributeName="cy" values="55;42;55" dur="2.2s" repeatCount="indefinite"/></circle><rect x="22" y="22" width="9" height="45" rx="4.5" fill="url(#g2)"/><text x="49" y="49" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="750">AgentContextMap</text><text x="24" y="94" fill="#A9B7CA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5">Map which repository instructions can affect coding agents.</text><line x1="24" y1="125" x2="546" y2="125" stroke="#FFFFFF" stroke-opacity=".07"/><circle cx="30" cy="158" r="5" fill="#F59E0B"/><text x="44" y="163" fill="#CBD5E1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">Rust</text><text x="199" y="163" fill="#FDE68A" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">★ 1</text><text x="280" y="163" fill="#C4B5FD" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">⑂ 0</text><text x="389" y="163" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">2026-09-01</text><rect x="24" y="178" width="522" height="3" rx="1.5" fill="#172033"/><rect x="24" y="178" width="172" height="3" rx="1.5" fill="url(#g2)"><animate attributeName="x" values="24;374;24" dur="4.7s" repeatCount="indefinite"/></rect></g>

